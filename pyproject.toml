[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-to-3d-converter"
version = "0.6.2"
description = "AI 2D-to-3D photo converter — turn flat photos into textured depth meshes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "photo3d maintainers" }]
keywords = ["depth-estimation", "photogrammetry", "3d", "point-cloud", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10.3",
    "pillow-heif>=0.16",
    "opencv-python-headless>=4.9",
    "scipy>=1.12",
    "trimesh>=4.4",
    "pygltflib>=1.16",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
cuda = ["torch>=2.3", "torchvision>=0.18"]
cpu  = ["torch>=2.3", "torchvision>=0.18"]
gui  = ["PySide6>=6.7"]
dev  = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-Pillow",
]

[project.scripts]
photo3d = "photo3d.cli:app"

[project.urls]
Homepage = "https://github.com/photo3d/photo-to-3d-converter"
Issues   = "https://github.com/photo3d/photo-to-3d-converter/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["photo3d*", "drivers*", "handlers*", "processors*", "services*", "models*", "utils*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["native/", "outputs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA-capable device",
    "slow: takes more than 30 seconds",
]